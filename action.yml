name: 'Static Embed DB Builder'
description: 'Builds static embed DB site from LaTeX files'
inputs:
  tex_glob:
    description: 'Glob pattern for input .tex files'
    required: true
  strip_paths:
    description: 'Number of path components to strip'
    required: false
    default: '0'
  dist_dir:
    description: 'Output directory for the built site'
    required: false
    default: '../dist'
runs:
  using: 'composite'
  steps:
    - run: git clone https://github.com/TCA166/static-embed-db.git src-static-embed-db
      shell: bash
    - run: cd src-static-embed-db && ./build.sh ${{ inputs.tex_glob }} --strip_paths ${{ inputs.strip_paths }}
      shell: bash
    - run: cp -a src-static-embed-db/dist/. ${{ inputs.dist_dir }}
      shell: bash
